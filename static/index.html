<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABES Student Support Chatbot</title>
<style>
  :root { --brand:#0b3d91; --bg:#f3f5fa; --card:#fff; --text:#1c2333; --muted:#6b7385; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:1.1rem; }
  header p { margin:2px 0 0; font-size:.8rem; opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:.95rem; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid #dde2ee; border-bottom-left-radius:4px; }
  .meta { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; font-size:.75rem; }
  .tag { padding:2px 8px; border-radius:999px; background:#eef1f8; color:var(--muted); }
  .High { background:#fde2e2; color:#b42318; font-weight:600; }
  .Medium { background:#fff1d6; color:#9a6200; font-weight:600; }
  .Low { background:#dff5e3; color:#1e7a34; font-weight:600; }
  .faq { margin-top:6px; font-size:.75rem; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--card); border-top:1px solid #dde2ee; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border:1px solid #c9d0e0; border-radius:10px; font-size:1rem; }
  button { padding:0 20px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>ABES Engineering College - Student Support Chatbot</h1>
  <p>Ask about exams, fees, library, hostel, admissions, scholarships, courses and IT support</p>
</header>

<div id="chat">
  <div class="msg bot">Hello! I am your student support assistant. Ask me anything, for example: "I cannot download my admit card and my exam is tomorrow".</div>
</div>

<form id="form">
  <input id="msg" placeholder="Type your query here..." autocomplete="off" required>
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("send");

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addMeta(div, data) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  if (data.priority) tags.push(["Priority: " + data.priority, data.priority]);
  if (data.department) tags.push(["Category: " + data.department, ""]);
  tags.push(["Similarity: " + data.similarity, ""]);
  tags.forEach(([t, c]) => { const s = document.createElement("span"); s.className = "tag " + c; s.textContent = t; meta.appendChild(s); });
  div.appendChild(meta);
  if (data.matched_faq) {
    const f = document.createElement("div");
    f.className = "faq";
    f.textContent = "Matched FAQ: " + data.matched_faq;
    div.appendChild(f);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  const wait = addMsg("Thinking...", "bot");
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const data = await res.json();
    wait.textContent = data.answer;
    addMeta(wait, data);
  } catch (err) {
    wait.textContent = "Server is not reachable. Please try again.";
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
